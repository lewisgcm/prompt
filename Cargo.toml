[workspace]
members = ["cli", "prompt_core", "ui/src-tauri"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.94"
tokio = { version = "1.42.0", features = ["rt", "rt-multi-thread"] }
rquickjs = { git = "https://github.com/DelSkayn/rquickjs.git", version = "0.8.1", features = [
    "full-async",
    "parallel",
    "rust-alloc",
    "dump-leaks",
], default-features = false }